<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Start a project with DAOVOS</title>
  <desc id="desc">Have an idea worth building? Start a project by emailing daovos.corp@gmail.com.</desc>
  <style>
    text { font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .arrow { animation: arrow 4.8s cubic-bezier(.65,0,.35,1) infinite alternate; }
    .pulse { animation: pulse 3.6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes arrow { 0%,22% { transform: translateX(0); } 78%,100% { transform: translateX(14px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .arrow, .pulse { animation: none !important; } }
  </style>

  <rect width="1200" height="400" fill="#111112"/>
  <path d="M40 40H1160V360H40Z" fill="none" stroke="#2B2B2E"/>
  <path d="M40 252H1160" stroke="#2B2B2E"/>

  <circle class="pulse" cx="1128" cy="72" r="6" fill="#F4EEE8"/>
  <text class="mono" x="68" y="78" fill="#ABA6A1" font-size="14" letter-spacing="3">SELECTED COMMISSIONS / OPEN</text>
  <text class="mono" x="1132" y="78" fill="#ABA6A1" font-size="14" letter-spacing="3" text-anchor="end">DAOVOS.CORP@GMAIL.COM</text>

  <text x="66" y="164" fill="#F4EEE8" font-size="62" font-weight="300" letter-spacing="2">HAVE AN IDEA</text>
  <text x="66" y="226" fill="#ABA6A1" font-size="62" font-weight="300" letter-spacing="2">WORTH BUILDING?</text>

  <rect x="40" y="252" width="1120" height="108" fill="#F4EEE8"/>
  <text x="66" y="326" fill="#111112" font-size="54" font-weight="700" letter-spacing="4">START A PROJECT</text>
  <g class="arrow" transform="translate(1084 306)" fill="none" stroke="#111112" stroke-width="4">
    <path d="M-34 0H24M4-20L24 0L4 20"/>
  </g>
</svg>
