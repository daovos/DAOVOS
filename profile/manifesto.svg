<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">DAOVOS manifesto</title>
  <desc id="desc">DAOVOS turns ambitious ideas into clear digital experiences.</desc>
  <style>
    text { font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .route { stroke-dasharray: 4 11; animation: route 16s linear infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 20s linear infinite; }
    .mark { animation: breathe 7s cubic-bezier(.65,0,.35,1) infinite; }
    .dot { animation: pulse 4s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes route { to { stroke-dashoffset: -240; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .route, .ring, .mark, .dot { animation: none !important; } }
  </style>
  <rect width="1200" height="430" fill="#0A0A0A"/>

  <g fill="none" stroke="#2B2B2E" stroke-width="1">
    <path d="M40 40H1160V390H40Z"/>
    <path d="M708 40V390"/>
    <path d="M40 112H1160"/>
  </g>

  <text class="mono" x="68" y="82" fill="#ABA6A1" font-size="10" letter-spacing="3">POSITION / 01</text>
  <text class="mono" x="1132" y="82" fill="#ABA6A1" font-size="10" letter-spacing="3" text-anchor="end">INDEPENDENT DIGITAL STUDIO</text>

  <g fill="#F4EEE8" font-weight="300" letter-spacing="-3">
    <text x="66" y="196" font-size="72">WE TURN IDEAS</text>
    <text x="66" y="270" font-size="72">INTO DIGITAL</text>
    <text x="66" y="344" font-size="72">EXPERIENCES.</text>
  </g>

  <g aria-label="Animated idea to system illustration">
    <path class="route" d="M796 252C842 194 888 310 934 252S1026 194 1072 252" fill="none" stroke="#5A5958"/>
    <path class="route" d="M796 252C842 310 888 194 934 252S1026 310 1072 252" fill="none" stroke="#2B2B2E"/>

    <g class="ring">
      <circle cx="796" cy="252" r="64" fill="none" stroke="#5A5958" stroke-dasharray="4 9"/>
      <circle cx="796" cy="252" r="42" fill="none" stroke="#2B2B2E"/>
      <path d="M796 178V190M796 314V326M722 252H734M858 252H870" stroke="#ABA6A1"/>
    </g>
    <circle class="dot" cx="796" cy="252" r="8" fill="#F4EEE8"/>

    <g transform="translate(934 252) rotate(45)">
      <rect x="-30" y="-30" width="60" height="60" fill="#111112" stroke="#ABA6A1"/>
      <rect x="-18" y="-18" width="36" height="36" fill="none" stroke="#2B2B2E"/>
      <circle cx="0" cy="0" r="4" fill="#F4EEE8"/>
    </g>

    <g class="mark" transform="translate(1072 252) scale(.43) translate(-511.5 -408)" fill="#F4EEE8">
      <rect x="478.5" y="240.8" width="66.3" height="162.7"/>
      <rect x="380.5" y="322.5" width="63.8" height="81"/>
      <rect x="578.7" y="322.5" width="63.8" height="81"/>
      <rect x="380.5" y="419.2" width="63.8" height="77.9"/>
      <rect x="478.5" y="419.2" width="66.3" height="156"/>
      <rect x="578.7" y="419.2" width="63.8" height="77.9"/>
    </g>
  </g>

  <text class="mono" x="760" y="362" fill="#ABA6A1" font-size="10" letter-spacing="3">IDEA → SYSTEM</text>
</svg>
