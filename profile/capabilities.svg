  <text class="mono" x="1132" y="78" fill="#ABA6A1" font-size="10" letter-spacing="3" text-anchor="end">DESIGN / BUILD / SCALE</text>

  <path class="route" d="M70 166H1130" stroke="#5A5958" stroke-width="1"/>

  <g transform="translate(68 214)">
