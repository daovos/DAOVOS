<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="174" viewBox="0 0 1200 174" role="img" aria-labelledby="title desc">
  <title id="title">From idea to digital experience</title>
  <desc id="desc">An animated DAOVOS process route connecting idea, structure, interface, and launch.</desc>
  <style>
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .track { stroke-dasharray: 4 10; animation: track 16s linear infinite; }
    .node { animation: node 5s cubic-bezier(.16,1,.3,1) infinite; }
    .n2 { animation-delay: .7s; }
    .n3 { animation-delay: 1.4s; }
    .n4 { animation-delay: 2.1s; }
    @keyframes track { to { stroke-dashoffset: -280; } }
    @keyframes node { 0%,100% { opacity: .35; transform: scale(.72); } 42%,62% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .track, .node { animation: none !important; } }
  </style>
  <rect width="1200" height="174" fill="#111112"/>
  <path d="M48 87H1152" stroke="#2B2B2E" stroke-width="1"/>
  <path class="track" d="M48 87H1152" stroke="#ABA6A1" stroke-width="1.5"/>

  <g fill="#F4EEE8">
    <g class="node" transform-origin="180px 87px"><rect x="172" y="79" width="16" height="16"/></g>
    <g class="node n2" transform-origin="460px 87px"><circle cx="460" cy="87" r="9"/></g>
    <g class="node n3" transform-origin="740px 87px"><path d="M740 76L751 87 740 98 729 87Z"/></g>
    <g class="node n4" transform-origin="1020px 87px"><rect x="1010" y="77" width="20" height="20" fill="none" stroke="#F4EEE8" stroke-width="2"/></g>
  </g>

  <g fill="#ABA6A1" font-size="10" letter-spacing="2">
    <text x="180" y="54" text-anchor="middle">01 / DISCOVER</text>
    <text x="460" y="126" text-anchor="middle">02 / DEFINE</text>
    <text x="740" y="54" text-anchor="middle">03 / DESIGN + BUILD</text>
    <text x="1020" y="126" text-anchor="middle">04 / LAUNCH + EVOLVE</text>
  </g>

  <text x="48" y="28" fill="#F4EEE8" font-size="11" letter-spacing="2.5">YOU / THE IDEA</text>
  <text x="1152" y="28" fill="#F4EEE8" font-size="11" letter-spacing="2.5" text-anchor="end">DAOVOS / THE BUILT RESPONSE</text>
</svg>
